version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.vercel
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_USER=airport_user
      - DB_PASS=airport_pass
      - DB_NAME=airport
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
    depends_on:
      - db
    volumes:
      - .:/var/www/html/

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: airport
      MYSQL_USER: airport_user
      MYSQL_PASSWORD: airport_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
